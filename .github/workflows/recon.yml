name: Authorized Nuclei Full Recon

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  recon:
    runs-on: ubuntu-latest

    env:
      TARGET: "tangerangselatankota.go.id"

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.24.x"

      - name: Install Recon Tools
        shell: bash
        run: |
          set -euo pipefail

          go install github.com/projectdiscovery/subfinder/v2/cmd/subfinder@latest
          go install github.com/projectdiscovery/httpx/cmd/httpx@latest
          go install github.com/projectdiscovery/nuclei/v3/cmd/nuclei@latest

          echo "$HOME/go/bin" >> "$GITHUB_PATH"

      - name: Prepare Results Directory
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p "results/${TARGET}"

      - name: Update Nuclei Templates
        shell: bash
        run: |
          set -euo pipefail

          nuclei -update-templates

      - name: Enumerate Subdomains
        shell: bash
        run: |
          set -euo pipefail

          subfinder \
            -d "${TARGET}" \
            -all \
            -silent \
            -o "results/${TARGET}/subdomains.txt"

          # Pastikan root domain ikut masuk.
          printf '%s\n' "${TARGET}" \
            >> "results/${TARGET}/subdomains.txt"

          sort -u \
            "results/${TARGET}/subdomains.txt" \
            -o "results/${TARGET}/subdomains.txt"

          echo "===== SUBDOMAIN SUMMARY ====="
          echo "Total unique subdomains:"
          wc -l "results/${TARGET}/subdomains.txt"

      - name: Probe HTTP Services
        shell: bash
        run: |
          set -euo pipefail

          httpx \
            -l "results/${TARGET}/subdomains.txt" \
            -silent \
            -follow-redirects \
            -status-code \
            -title \
            -tech-detect \
            -o "results/${TARGET}/live.txt"

          awk '{print $1}' \
            "results/${TARGET}/live.txt" \
            | sort -u \
            > "results/${TARGET}/urls.txt"

          echo "===== HTTP SUMMARY ====="
          echo "Live HTTP/HTTPS URLs:"
          wc -l "results/${TARGET}/urls.txt"

      - name: Display Nuclei Input
        shell: bash
        run: |
          set -euo pipefail

          echo "===== NUCLEI INPUT ====="
          cat "results/${TARGET}/urls.txt"

          echo
          echo "Total targets:"
          wc -l "results/${TARGET}/urls.txt"

      - name: Nuclei Full Template Scan
        shell: bash
        run: |
          set -euo pipefail

          TODAY="$(date -u +%Y-%m-%d)"

          OUT="results/${TARGET}/nuclei-${TODAY}.txt"

          nuclei \
            -l "results/${TARGET}/urls.txt" \
            -severity low,medium,high,critical \
            -silent \
            -retries 2 \
            -timeout 10 \
            -rate-limit 25 \
            -bulk-size 10 \
            -concurrency 10 \
            -o "$OUT"

          echo "===== NUCLEI SUMMARY ====="

          if [ -f "$OUT" ]; then
            echo "Result file:"
            echo "$OUT"

            echo
            echo "Total findings:"
            wc -l "$OUT"
          else
            echo "No Nuclei output file generated."
            touch "$OUT"
          fi

      - name: Create Latest Result
        shell: bash
        run: |
          set -euo pipefail

          TODAY="$(date -u +%Y-%m-%d)"

          cp \
            "results/${TARGET}/nuclei-${TODAY}.txt" \
            "results/${TARGET}/nuclei-latest.txt"

      - name: Generate Scan Metadata
        shell: bash
        run: |
          set -euo pipefail

          TODAY="$(date -u +%Y-%m-%d)"

          {
            echo "Target: ${TARGET}"
            echo "Scan date: ${TODAY}"
            echo
            echo "Subdomains:"
            wc -l "results/${TARGET}/subdomains.txt"
            echo
            echo "Live URLs:"
            wc -l "results/${TARGET}/urls.txt"
            echo
            echo "Nuclei findings:"
            wc -l "results/${TARGET}/nuclei-${TODAY}.txt"
          } > "results/${TARGET}/scan-summary-${TODAY}.txt"

      - name: Commit Results
        shell: bash
        run: |
          set -euo pipefail

          TODAY="$(date -u +%Y-%m-%d)"

          git config user.name "github-actions[bot]"
          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git add "results/${TARGET}/"

          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi

          git commit \
            -m "Nuclei scan update - ${TARGET} - ${TODAY}"

          git push
